name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test event updater
        run: node --test scripts/update-events.test.mjs
      - name: Refresh event data
        if: github.event_name != 'push'
        run: |
          node scripts/update-events.mjs
          node scripts/build-event-data.mjs
      - name: Commit refreshed events
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/events.json dist/events-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Update calendar events"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
